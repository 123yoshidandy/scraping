name: Page Watch

on:
  schedule:
    # UTC指定。人気の分（:00等）は遅延しやすいためオフセット分を使用。
    # ⚠️ プライベートリポジトリの場合、10分間隔は無料枠(2,000分/月)を大幅に超過する。
    #    間隔の調整方法は README の「GitHub Actions の運用」を参照。
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# 遅延したcron実行が重複して走り、stateキャッシュを壊すのを防ぐ
concurrency:
  group: page-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # ハングしたブラウザでデフォルトの6時間分のクォータを浪費しないための上限。
    # 同梱の targets.json で1回の実行は数分（ホストをまたいで並列にチェックする）。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # stateの復元: key は絶対にヒットしないユニーク値にし、
      # restore-keys のプレフィックス一致で「最新のキャッシュ」を取得する
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: watch-state-${{ github.run_id }}
          restore-keys: |
            watch-state-

      - name: Run checks
        run: npm run check
        env:
          # Discord 通知用。リポジトリの Secrets に登録する（未登録なら空になり、Discord 通知は無効のまま）
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 条件成立時にジョブを失敗させ、GitHub標準の失敗通知メールも使う場合はコメントを外す
          # （stateの保存は if: always() の別ステップなので安全）
          # FAIL_ON_TRIGGER: "1"

      # 統合版 actions/cache はジョブ失敗時に保存をスキップするため、
      # 分割版の save を if: always() で必ず実行する
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: watch-state-${{ github.run_id }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 5
